name: PostureLens Security Scan

on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '**/*.yaml'
      - '**/*.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  security-scan:
    name: PostureLens Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Open Policy Agent (OPA)
        uses: open-policy-agent/setup-opa@v2
        with:
          opa-version: 'latest'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start PostureLens API Backend
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          
          # Wait for backend health check
          echo "Waiting for PostureLens API to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "PostureLens API is up and running!"
              exit 0
            fi
            sleep 1
          done
          echo "Error: PostureLens API failed to start within timeout."
          exit 1

      - name: Run PostureLens Security Scan
        run: |
          python scripts/ci_scan.py
