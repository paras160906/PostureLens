apiVersion: v1
kind: Pod
metadata:
  name: privileged-debug-pod
  namespace: default
spec:
  hostNetwork: true
  hostPID: true
  hostIPC: true
  containers:
    - name: debug-tools
      image: ubuntu:latest
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0
        readOnlyRootFilesystem: false
        capabilities:
          add:
            - SYS_ADMIN
            - NET_ADMIN
            - ALL
      # Missing resources limits and requests intentionally
